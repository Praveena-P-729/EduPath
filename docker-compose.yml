version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: edupath_postgres
    environment:
      POSTGRES_USER: edupath
      POSTGRES_PASSWORD: edupath_password_2026
      POSTGRES_DB: edupath_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edupath -d edupath_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edupath_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://edupath:edupath_password_2026@postgres:5432/edupath_db
      - SECRET_KEY=edupath_super_secret_jwt_key_2026_hackathon_demo
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edupath_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

